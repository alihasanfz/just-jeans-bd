<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="denimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- JB Icon Badge -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#denimGrad)" />
    <!-- Stitching effect -->
    <rect x="15" y="15" width="70" height="70" rx="16" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
    <!-- JB Letters -->
    <text x="50" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">JB</text>
  </g>

  <!-- Brand Typography -->
  <text x="108" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#0f172a" letter-spacing="1">JEANS <tspan fill="#2563eb">BD</tspan></text>
  
  <!-- Sub-tagline -->
  <text x="110" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#64748b" letter-spacing="3.5">PREMIUM DENIM HOUSE</text>

  <!-- Rivet accent -->
  <circle cx="80" cy="20" r="3" fill="url(#goldGrad)" stroke="#b45309" stroke-width="0.8" />
</svg>
